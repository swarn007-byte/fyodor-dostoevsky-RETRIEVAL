        body{min-height:100vh;display:flex;justify-content:center;align-items:center;background:#f0efec;font-family:'Cormorant Garamond',serif;overflow:hidden}
        .scene{position:relative;width:700px;height:950px;display:flex;justify-content:center;align-items:center}
        .ap{position:absolute;pointer-events:none}.ap svg{width:100%;height:100%}
        .ap:nth-child(1){width:14px;height:20px;top:12%;left:18%;opacity:0;animation:drift 13s ease-in-out 0s infinite}
        .ap:nth-child(2){width:10px;height:16px;top:20%;left:78%;opacity:0;animation:drift 15s ease-in-out 2s infinite}
        .ap:nth-child(3){width:12px;height:18px;top:70%;left:12%;opacity:0;animation:drift 11s ease-in-out 4s infinite}
        .ap:nth-child(4){width:8px;height:14px;top:62%;left:85%;opacity:0;animation:drift 14s ease-in-out 1s infinite}
        @keyframes drift{0%,100%{opacity:0;transform:translateY(0) rotate(0)}10%{opacity:.45}50%{opacity:.25;transform:translateY(-30px) rotate(18deg)}90%{opacity:.45}}
        .figure{position:relative;display:flex;flex-direction:column;align-items:center}
        .main-svg{width:460px;height:740px}
        .brand-text{margin-top:8px;text-align:center}
        .brand-text h1{font-family:'Cormorant Garamond',serif;font-size:2.8rem;font-weight:400;color:#3a3a3a;letter-spacing:.06em}
